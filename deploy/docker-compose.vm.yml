services:
  app:
    image: ${APP_IMAGE:?set APP_IMAGE to the image tag to deploy}
    ports:
      - "127.0.0.1:${APP_PORT:-8090}:8090"
    env_file:
      - ${ENV_FILE:?set ENV_FILE to the VM copy of the environment file}
    volumes:
      - pb_data:/app/pb_data
      - ${ENV_FILE:?set ENV_FILE to the VM copy of the environment file}:/app/.env:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8090/_/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  caddy:
    image: caddy:2.8-alpine
    environment:
      CADDY_HOSTNAMES: ${CADDY_HOSTNAMES:-jserd.duckdns.org}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      app:
        condition: service_healthy

volumes:
  pb_data:
  caddy_data:
